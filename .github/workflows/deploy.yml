name: Deploy (prod)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP_ROOT: /var/www/amp.lucashussey.com
      RELEASE_PATH: /var/www/amp.lucashussey.com/releases/${{ github.sha }}
      CURRENT_PATH: /var/www/amp.lucashussey.com/current
      WEB_DIST: /var/www/amp.lucashussey.com/html

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run targeted validation
        run: |
          pnpm --dir apps/server test -- --run src/routes/auth.test.ts
          pnpm --dir apps/web build
          pnpm --dir apps/server build

      - name: Deploy to OCI via rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "."
          REMOTE_HOST: ${{ secrets.OCI_HOST }}
          REMOTE_USER: ${{ secrets.OCI_USERNAME }}
          TARGET: ${{ env.RELEASE_PATH }}

      - name: Prepare deployment and restart services
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -euo pipefail

            APP_ROOT="/var/www/amp.lucashussey.com"
            RELEASE_PATH="${APP_ROOT}/releases/${{ github.sha }}"
            CURRENT_PATH="${APP_ROOT}/current"
            WEB_DIST="${APP_ROOT}/html"
            SHARED_DIR="${APP_ROOT}/shared"

            mkdir -p "${SHARED_DIR}" "${WEB_DIST}"
            mkdir -p "${APP_ROOT}/releases"

            cat > "${SHARED_DIR}/.env" <<'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DEFAULT_USER_PASSWORD=${{ secrets.DEFAULT_USER_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            PORT=4000
            EOF

            ln -sfn "${RELEASE_PATH}" "${CURRENT_PATH}"

            cd "${RELEASE_PATH}"
            pnpm install --frozen-lockfile
            cp "${SHARED_DIR}/.env" "apps/server/.env"

            pnpm --dir apps/server build
            pnpm --dir apps/web build

            rm -rf "${WEB_DIST}/*"
            cp -R "apps/web/dist/." "${WEB_DIST}/"

            sudo systemctl daemon-reload
            sudo systemctl restart amp-api
            sudo nginx -t
            sudo systemctl reload nginx
