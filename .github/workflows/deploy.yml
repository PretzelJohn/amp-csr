name: Deploy (prod)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP_ROOT: /var/www/amp.lucashussey.com
      RELEASE_PATH: /var/www/amp.lucashussey.com/releases/${{ github.sha }}
      CURRENT_PATH: /var/www/amp.lucashussey.com/current
      WEB_DIST: /var/www/amp.lucashussey.com/html

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "pnpm"

      - name: Install Server Dependencies
        run: pnpm --filter apps/server install

      - name: Install Shared Dependencies
        run: pnpm --filter packages/shared install

      - name: Install Web Dependencies
        run: pnpm --filter apps/web install

      - name: Build Server
        run: pnpm --filter apps/server run build

      - name: Build Shared
        run: pnpm --filter packages/shared run build

      - name: Build React App
        run: pnpm --filter apps/web run build

      - name: Deploy to OCI via rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "."
          REMOTE_HOST: ${{ secrets.OCI_HOST }}
          REMOTE_USER: ${{ secrets.OCI_USERNAME }}
          TARGET: ${{ env.RELEASE_PATH }}

      - name: Prepare deployment and restart services
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEFAULT_USER_PASSWORD: ${{ secrets.DEFAULT_USER_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/oci_key "${OCI_USERNAME}@${OCI_HOST}" <<'REMOTE'
            set -euo pipefail

            APP_ROOT="/var/www/amp.lucashussey.com"
            RELEASE_PATH="${APP_ROOT}/releases/${{ github.sha }}"
            CURRENT_PATH="${APP_ROOT}/current"
            WEB_DIST="${APP_ROOT}/html"
            SHARED_DIR="${APP_ROOT}/shared"

            sudo mkdir -p "${SHARED_DIR}" "${WEB_DIST}"
            sudo mkdir -p "${APP_ROOT}/releases"

            cat > "${SHARED_DIR}/.env" <<EOF
            DATABASE_URL=${DATABASE_URL}
            DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            PORT=4000
            EOF

            sudo ln -sfn "${RELEASE_PATH}" "${CURRENT_PATH}"

            cd "${RELEASE_PATH}"
            pnpm install --frozen-lockfile
            sudo cp "${SHARED_DIR}/.env" "apps/server/.env"

            pnpm --dir apps/server build
            pnpm --dir apps/web build

            sudo rm -rf "${WEB_DIST}"/*
            sudo cp -R "apps/web/dist/." "${WEB_DIST}/"

            sudo systemctl daemon-reload
            sudo systemctl restart amp-api
            sudo nginx -t
            sudo systemctl reload nginx
          REMOTE
