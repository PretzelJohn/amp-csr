name: Deploy (prod)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP_ROOT: /var/www/amp.lucashussey.com
      RELEASE_PATH: /var/www/amp.lucashussey.com/releases/${{ github.sha }}
      CURRENT_PATH: /var/www/amp.lucashussey.com/current
      WEB_DIST: /var/www/amp.lucashussey.com/html

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "pnpm"

      - name: Install Server Dependencies
        run: pnpm --filter apps/server install

      - name: Install Shared Dependencies
        run: pnpm --filter packages/shared install

      - name: Install Web Dependencies
        run: pnpm --filter apps/web install

      - name: Build Server
        run: pnpm --filter apps/server run build

      - name: Build Shared
        run: pnpm --filter packages/shared run build

      - name: Build React App
        run: pnpm --filter apps/web run build

      - name: Prepare remote deployment directory
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          export HOME="${HOME:-/home/runner}"
          SSH_DIR="${HOME}/.ssh"

          [[ -n "$OCI_HOST" && -n "$OCI_USERNAME" && -n "$OCI_SSH_KEY" ]] || {
            echo "Missing OCI deployment secrets: OCI_HOST, OCI_USERNAME, or OCI_SSH_KEY"
            exit 1
          }

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"
          printf '%s' "$OCI_SSH_KEY" > "$SSH_DIR/oci_key"
          chmod 600 "$SSH_DIR/oci_key"

          ssh -o StrictHostKeyChecking=no -i "$SSH_DIR/oci_key" "${OCI_USERNAME}@${OCI_HOST}" "sudo mkdir -p /var/www/amp.lucashussey.com/releases /var/www/amp.lucashussey.com/shared /var/www/amp.lucashussey.com/html && sudo chown -R ${OCI_USERNAME}:${OCI_USERNAME} /var/www/amp.lucashussey.com"

      - name: Deploy to OCI via rsync
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          TARGET: ${{ env.RELEASE_PATH }}
        run: |
          export HOME="${HOME:-/home/runner}"
          SSH_DIR="${HOME}/.ssh"

          [[ -n "$OCI_HOST" && -n "$OCI_USERNAME" && -n "$OCI_SSH_KEY" ]] || {
            echo "Missing OCI deployment secrets: OCI_HOST, OCI_USERNAME, or OCI_SSH_KEY"
            exit 1
          }

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"
          printf '%s' "$OCI_SSH_KEY" > "$SSH_DIR/oci_key"
          chmod 600 "$SSH_DIR/oci_key"

          ssh -o StrictHostKeyChecking=no -i "$SSH_DIR/oci_key" "${OCI_USERNAME}@${OCI_HOST}" "sudo mkdir -p '${TARGET}' && sudo chown -R ${OCI_USERNAME}:${OCI_USERNAME} /var/www/amp.lucashussey.com"

          rsync -avz --delete \
            -e "ssh -i '$SSH_DIR/oci_key' -o StrictHostKeyChecking=no" \
            . "${OCI_USERNAME}@${OCI_HOST}:${TARGET}/"

      - name: Prepare deployment and restart services
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEFAULT_USER_PASSWORD: ${{ secrets.DEFAULT_USER_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          export HOME="${HOME:-/home/runner}"
          SSH_DIR="${HOME}/.ssh"

          [[ -n "$OCI_HOST" && -n "$OCI_USERNAME" && -n "$OCI_SSH_KEY" ]] || {
            echo "Missing OCI deployment secrets: OCI_HOST, OCI_USERNAME, or OCI_SSH_KEY"
            exit 1
          }

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"
          printf '%s' "$OCI_SSH_KEY" > "$SSH_DIR/oci_key"
          chmod 600 "$SSH_DIR/oci_key"

          export REMOTE_DATABASE_URL="$DATABASE_URL"
          export REMOTE_DEFAULT_USER_PASSWORD="$DEFAULT_USER_PASSWORD"
          export REMOTE_JWT_SECRET="$JWT_SECRET"

          ssh -o StrictHostKeyChecking=no -i "$SSH_DIR/oci_key" "${OCI_USERNAME}@${OCI_HOST}" "bash -s" <<REMOTE
            set -euo pipefail

            export DATABASE_URL="${REMOTE_DATABASE_URL}"
            export DEFAULT_USER_PASSWORD="${REMOTE_DEFAULT_USER_PASSWORD}"
            export JWT_SECRET="${REMOTE_JWT_SECRET}"

            APP_ROOT="/var/www/amp.lucashussey.com"
            RELEASE_PATH="${APP_ROOT}/releases/${{ github.sha }}"
            CURRENT_PATH="${APP_ROOT}/current"
            WEB_DIST="${APP_ROOT}/html"
            SHARED_DIR="${APP_ROOT}/shared"

            sudo mkdir -p "${SHARED_DIR}" "${WEB_DIST}"
            sudo mkdir -p "${APP_ROOT}/releases"

            cat > "${SHARED_DIR}/.env" <<EOF
            DATABASE_URL=${DATABASE_URL}
            DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            PORT=4000
            EOF

            sudo ln -sfn "${RELEASE_PATH}" "${CURRENT_PATH}"

            cd "${RELEASE_PATH}"
            pnpm install --frozen-lockfile
            sudo cp "${SHARED_DIR}/.env" "apps/server/.env"

            pnpm --dir apps/server build
            pnpm --dir apps/web build

            sudo rm -rf "${WEB_DIST}"/*
            sudo cp -R "apps/web/dist/." "${WEB_DIST}/"

            sudo systemctl daemon-reload
            sudo systemctl restart amp-api
            sudo nginx -t
            sudo systemctl reload nginx
          REMOTE
